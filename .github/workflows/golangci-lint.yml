name: golangci-lint
on:
  push:
    branches:
    - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          cache: false
          # Must satisfy the go directive of the golangci-lint version below,
          # as setup-go@v7 sets GOTOOLCHAIN=local.
          go-version: "1.26"

      # The action detects .custom-gcl.yml, builds the custom binary with the
      # attestantio plugin, and runs it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: "--timeout=60m"
          only-new-issues: true
