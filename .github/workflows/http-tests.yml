name: http-tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'

      - name: Validate required variables
        run: |
          if [ -z "${{ vars.HTTP_ADDRESS }}" ]; then
            echo "Error: HTTP_ADDRESS variable is not set in repository variables"
            exit 1
          fi
          if [ -z "${{ vars.HTTP_TEST_CONCURRENCY }}" ]; then
            echo "Error: HTTP_TEST_CONCURRENCY variable is not set in repository variables"
            exit 1
          fi

      - name: Run HTTP tests
        env:
          HTTP_ADDRESS: ${{ vars.HTTP_ADDRESS }}
          HTTP_TEST_CONCURRENCY: ${{ vars.HTTP_TEST_CONCURRENCY }}
          HTTP_BEARER_TOKEN: ${{ secrets.HTTP_BEARER_TOKEN }}
        run: go test -v -timeout=10m ./http/...

  gloas:
    name: Gloas HTTP tests (advisory)
    # Advisory: require a configured endpoint. Fork PRs cannot read
    # HTTP_BEARER_TOKEN_GLOAS, so do not attempt an unauthenticated run.
    if: ${{ vars.HTTP_ADDRESS_GLOAS != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'

      - name: Run Gloas HTTP tests
        env:
          HTTP_ADDRESS: ${{ vars.HTTP_ADDRESS_GLOAS }}
          HTTP_TEST_CONCURRENCY: ${{ vars.HTTP_TEST_CONCURRENCY }}
          HTTP_BEARER_TOKEN: ${{ secrets.HTTP_BEARER_TOKEN_GLOAS }}
          # Turns every Gloas fork gate from a skip into a failure. The point of
          # the job is to prove the gated tests run, so a skip here means the
          # endpoint is not on Gloas or the gate itself is broken.
          HTTP_REQUIRE_GLOAS: 'true'
        # Temporary exception to full-suite selection: v3 block-production tests
        # cannot pass on Gloas nodes. Remove the filter when those tests are gated
        # on node capability; new Gloas live tests must match this pattern meanwhile.
        run: go test -v -timeout=10m -run 'Gloas|EPBS|ExecutionPayload' ./http/...
